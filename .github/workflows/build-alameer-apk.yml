name: Build Alameer Brand APK

on:
  push:
    paths:
      - '.github/workflows/build-alameer-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/alameer/brand
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AlameerBrand'
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.alameer.brand'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.alameer.brand'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="الأمير براند"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p android-app/app/src/main/res/values
          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:windowBackground">#111111</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/java/com/alameer/brand/MainActivity.java <<'EOF'
          package com.alameer.brand;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String HOME = "https://storeqn.github.io/-alameer-brand/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(17,17,17));
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(url);
                      }

                      private boolean handleUrl(String url) {
                          if (url.startsWith("https://storeqn.github.io/") || url.startsWith("http://storeqn.github.io/")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }
                  });

                  if (savedInstanceState == null) webView.loadUrl(HOME);
                  else webView.restoreState(savedInstanceState);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Alameer-Brand.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alameer-Brand-APK
          path: Alameer-Brand.apk
          retention-days: 30
