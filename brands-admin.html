<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إدارة البراندات | الأمير براند</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#171512;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:20px auto 50px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.07)}h1{font-size:23px;margin:0 0 6px}p{color:#777;margin:0 0 18px}.field{margin-bottom:14px}label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}input{width:100%;border:1px solid #e1ddd5;border-radius:13px;padding:13px 14px;font:inherit;font-size:16px;outline:none}input:focus{border-color:#b68b3d}.preview{display:none;width:120px;height:80px;object-fit:contain;border:1px solid #eee;border-radius:12px;margin-top:8px;background:#fafafa}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.secondary,.edit,.delete{border:0;border-radius:13px;padding:13px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#11100e;color:#fff}.secondary{background:#eee9df;color:#171512}.status{display:none;margin:12px 0;padding:11px;border-radius:12px;text-align:center;font-weight:700}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.err{display:block;background:#ffebeb;color:#b42318}.toolbar{display:flex;gap:8px;margin:18px 0 10px}.toolbar input{flex:1}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:10px;align-items:center;border:1px solid #eee7dc;border-radius:15px;padding:9px}.item img{width:72px;height:52px;object-fit:contain;background:#fafafa;border-radius:10px}.name{font-weight:800;overflow:hidden;text-overflow:ellipsis}.url{font-size:11px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit{background:#11100e;color:#fff;padding:9px 11px}.delete{background:#fff0f0;color:#a52222;padding:9px 11px}.empty{text-align:center;color:#777;padding:25px}.hint{font-size:12px;color:#777;line-height:1.6;margin-top:5px}@media(max-width:560px){.item{grid-template-columns:58px minmax(0,1fr) auto}.item img{width:58px;height:46px}.delete{grid-column:2/4}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>إدارة البراندات والشعارات</h1>
    <p>أضف البراند مرة واحدة وسيستخدم المتجر شعاره تلقائيًا.</p>
    <form id="brandForm">
      <div class="field"><label>اسم البراند *</label><input id="brandName" required placeholder="مثال: CeraVe" autocomplete="off"></div>
      <div class="field"><label>رابط صورة الشعار *</label><input id="brandLogo" type="url" required placeholder="https://..."><img id="preview" class="preview" alt="معاينة الشعار"><div class="hint">يفضل WebP أو PNG بخلفية شفافة وحجم صغير.</div></div>
      <div class="actions"><button id="saveBtn" class="primary" type="submit">حفظ البراند</button><button id="cancelBtn" class="secondary" type="button" hidden>إلغاء التعديل</button></div>
      <div id="status" class="status"></div>
    </form>
    <div class="toolbar"><input id="search" type="search" placeholder="ابحث عن براند..."><button id="refresh" class="secondary" type="button">↻</button></div>
    <div id="list" class="list"><div class="empty">جاري تحميل البراندات...</div></div>
  </div>
</div>
<script src="config.js"></script>
<script>
const API_URL=(window.STORE_CONFIG&&window.STORE_CONFIG.apiUrl)||"https://script.google.com/macros/s/AKfycbwxFs75do4gJ941Agg0x6432z18qPjqkZ0ucutOCkaH-keZfDGP_xCPRhawbVXLIw8Y/exec";
const $=id=>document.getElementById(id);let brands=[],editing="";
function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(msg,type){const e=$("status");e.textContent=msg;e.className="status "+type}
function clearStatus(){$("status").className="status"}
async function load(){try{const r=await fetch(API_URL+(API_URL.includes("?")?"&":"?")+"action=brands&_="+Date.now(),{cache:"no-store"});const j=await r.json();if(!j.success)throw new Error(j.error||"تعذر التحميل");brands=j.brands||[];render()}catch(e){console.error(e);$("list").innerHTML='<div class="empty">تعذر تحميل البراندات. بعد تحديث كود Apps Script ونشر إصدار جديد أعد المحاولة.</div>'}}
function render(){const q=$("search").value.trim().toLowerCase();const arr=brands.filter(b=>!q||String(b.name||"").toLowerCase().includes(q));$("list").innerHTML=arr.length?arr.map(b=>`<div class="item"><img src="${esc(b.logo)}" loading="lazy" decoding="async" onerror="this.style.opacity='.25'"><div><div class="name">${esc(b.name)}</div><div class="url">${esc(b.logo)}</div></div><button class="edit" type="button" data-edit="${esc(b.name)}">تعديل</button><button class="delete" type="button" data-delete="${esc(b.name)}">حذف</button></div>`).join(""):'<div class="empty">لا توجد براندات بعد.</div>'}
function reset(){editing="";$("brandForm").reset();$("preview").style.display="none";$("cancelBtn").hidden=true;$("saveBtn").textContent="حفظ البراند";clearStatus()}
$("brandLogo").addEventListener("input",e=>{const u=e.target.value.trim();$("preview").src=u;$("preview").style.display=u?"block":"none"});
$("search").addEventListener("input",render);$("refresh").addEventListener("click",load);$("cancelBtn").addEventListener("click",reset);
$("list").addEventListener("click",async e=>{const edit=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(edit){const b=brands.find(x=>x.name===edit.dataset.edit);if(!b)return;editing=b.name;$("brandName").value=b.name;$("brandLogo").value=b.logo;$("preview").src=b.logo;$("preview").style.display="block";$("cancelBtn").hidden=false;$("saveBtn").textContent="حفظ التعديل";window.scrollTo({top:0,behavior:"smooth"})}if(del){if(!confirm("حذف شعار البراند "+del.dataset.delete+"؟"))return;const d=new URLSearchParams({action:"brand_delete",name:del.dataset.delete});try{await fetch(API_URL,{method:"POST",body:d,mode:"no-cors"});setTimeout(load,350)}catch(_){status("تعذر الحذف","err")}}});
$("brandForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("saveBtn"),name=$("brandName").value.trim(),logo=$("brandLogo").value.trim();btn.disabled=true;btn.textContent="جاري الحفظ...";const d=new URLSearchParams({action:"brand_upsert",name,logo});if(editing)d.append("old_name",editing);try{await fetch(API_URL,{method:"POST",body:d,mode:"no-cors"});status("✅ تم إرسال بيانات البراند للحفظ","ok");reset();setTimeout(load,350)}catch(err){console.error(err);status("❌ تعذر الحفظ","err")}btn.disabled=false;btn.textContent="حفظ البراند"});
load();
</script>
</body>
</html>
